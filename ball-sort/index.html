<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ball Sort Playable</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1446; touch-action: none;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #top { position: fixed; top: 6%; left: 0; right: 0; text-align: center; color: #fff; pointer-events: none; }
  #top b { display: block; font-size: 26px; letter-spacing: .5px; }
  #top span { font-size: 15px; opacity: .7; }
  #end { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(14, 10, 40, .93); color: #fff; text-align: center; padding: 0 16px; }
  #end.show { display: flex; animation: fade .35s ease-out; }
  #end h1 { font-size: 36px; margin: 0 0 8px; }
  #end p { margin: 0 0 28px; opacity: .85; font-size: 17px; }
  #cta { font-size: 22px; font-weight: 800; color: #fff; background: linear-gradient(#3ee07a, #18a84f); border: 0;
    border-radius: 40px; padding: 16px 48px; box-shadow: 0 6px 0 #0d7a37; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.07); } }
  @keyframes fade { from { opacity: 0; } }
</style>
</head>
<body>
<div id="top"><b>Sort the balls!</b><span>Tap a tube, then tap where to drop</span></div>
<canvas id="c"></canvas>
<div id="end"><h1 id="endTitle">Brilliant!</h1><p>500+ relaxing levels are waiting</p><button id="cta">PLAY NOW</button></div>
<script>
// Store URL is swapped per campaign / ad network.
const STORE_URL = 'https://play.google.com/store/apps';
const CAP = 3;
const AUTO_END_MS = 30000;
const MOVE_MS = 380;
const COLORS = { R: ['#ff8fa3', '#e8304f'], B: ['#9fd3ff', '#2a86e0'] };

const tubes = [['R', 'R', 'B'], ['B', 'B', 'R'], []];
let sel = -1, anim = null, shake = null, moves = 0, done = false, confetti = [];

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, L;

function layout() {
  const d = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  const tw = Math.min(W * 0.2, H * 0.12);
  const r = tw * 0.38, gap = tw * 0.75, th = CAP * r * 2.2 + r * 0.8;
  const total = tubes.length * tw + (tubes.length - 1) * gap;
  const x0 = (W - total) / 2;
  L = { tw, r, th, gap, x0, y0: H * 0.56 - th / 2 };
}
const tubeX = i => L.x0 + i * (L.tw + L.gap);
const slotPos = (t, k) => ({ x: tubeX(t) + L.tw / 2, y: L.y0 + L.th - L.r * 1.3 - k * L.r * 2.2 });
const liftPos = t => ({ x: tubeX(t) + L.tw / 2, y: L.y0 - L.r * 1.7 });

function canMove(a, b) {
  const A = tubes[a], B = tubes[b];
  return A.length > 0 && B.length < CAP && (B.length === 0 || B[B.length - 1] === A[A.length - 1]);
}
const isSolved = () => tubes.every(t => t.length === 0 || (t.length === CAP && t.every(c => c === t[0])));

function tubeAt(x, y) {
  if (y < L.y0 - L.r * 4 || y > L.y0 + L.th + L.r * 2) return -1;
  for (let i = 0; i < tubes.length; i++) {
    const tx = tubeX(i);
    if (x >= tx - L.gap / 2 && x <= tx + L.tw + L.gap / 2) return i;
  }
  return -1;
}

function tap(i) {
  if (anim || done || i < 0) return;
  if (sel < 0) { if (tubes[i].length) sel = i; return; }
  if (i === sel) { sel = -1; return; }
  if (!canMove(sel, i)) { shake = { t: i, s: performance.now() }; sel = -1; return; }
  anim = { c: tubes[sel].pop(), from: sel, to: i, s: performance.now() };
  sel = -1;
}

function finishMove() {
  tubes[anim.to].push(anim.c);
  anim = null; moves++;
  if (isSolved()) win();
}

function win() {
  done = true;
  for (let i = 0; i < 90; i++) {
    confetti.push({ x: W / 2, y: H * 0.45, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4,
      c: ['#ffd23f', '#ff4d6d', '#4dabff', '#3ee07a'][i % 4], a: Math.random() * 6 });
  }
  setTimeout(() => showEnd('Brilliant!'), 1300);
}

function showEnd(title) {
  document.getElementById('endTitle').textContent = title;
  document.getElementById('end').classList.add('show');
}

function openStore() {
  try { if (window.mraid && mraid.open) { mraid.open(STORE_URL); return; } } catch (e) { /* fall through */ }
  window.open(STORE_URL, '_blank');
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

function drawBall(p, c) {
  const g = ctx.createRadialGradient(p.x - L.r * .35, p.y - L.r * .35, L.r * .1, p.x, p.y, L.r);
  g.addColorStop(0, COLORS[c][0]); g.addColorStop(1, COLORS[c][1]);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, L.r, 0, Math.PI * 2); ctx.fill();
}

function lerp(a, b, t) { return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }

function animPos(now) {
  const t = Math.min(1, (now - anim.s) / MOVE_MS);
  const a = liftPos(anim.from), b = liftPos(anim.to), c = slotPos(anim.to, tubes[anim.to].length);
  const p = t < .55 ? lerp(a, b, t / .55) : lerp(b, c, (t - .55) / .45);
  return { p, t };
}

function drawHand(now) {
  if (moves > 0 || anim || done) return;
  const target = sel < 0 ? 0 : 2;
  const bob = Math.sin(now / 180) * 8;
  ctx.font = `${L.tw * .9}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('👆', tubeX(target) + L.tw * .6, L.y0 + L.th + L.tw * .9 + bob);
}

function loop(now) {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#2b1f6b'); bg.addColorStop(1, '#120c33');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  tubes.forEach((tube, i) => {
    let dx = 0;
    if (shake && shake.t === i) {
      const e = now - shake.s;
      if (e < 320) dx = Math.sin(e / 22) * 7 * (1 - e / 320); else shake = null;
    }
    ctx.save(); ctx.translate(dx, 0);
    roundRect(tubeX(i), L.y0, L.tw, L.th, L.tw * .45);
    ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.stroke();
    tube.forEach((c, k) => {
      if (sel === i && k === tube.length - 1) return;
      drawBall(slotPos(i, k), c);
    });
    ctx.restore();
  });

  if (sel >= 0) {
    const p = liftPos(sel);
    drawBall({ x: p.x, y: p.y + Math.sin(now / 140) * 4 }, tubes[sel][tubes[sel].length - 1]);
  }
  if (anim) {
    const { p, t } = animPos(now);
    drawBall(p, anim.c);
    if (t >= 1) finishMove();
  }

  drawHand(now);

  confetti.forEach(q => {
    q.x += q.vx; q.y += q.vy; q.vy += .35; q.a += .2;
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.a);
    ctx.fillStyle = q.c; ctx.fillRect(-5, -3, 10, 6); ctx.restore();
  });
  confetti = confetti.filter(q => q.y < H + 20);

  requestAnimationFrame(loop);
}

function start() {
  layout();
  addEventListener('resize', layout);
  cv.addEventListener('pointerdown', e => tap(tubeAt(e.clientX, e.clientY)));
  document.getElementById('end').addEventListener('pointerdown', openStore);
  setTimeout(() => { if (!done) { done = true; showEnd('Can you solve it?'); } }, AUTO_END_MS);
  requestAnimationFrame(loop);
}

if (window.mraid) {
  if (mraid.getState() === 'loading') mraid.addEventListener('ready', start); else start();
} else {
  start();
}
</script>
</body>
</html>
